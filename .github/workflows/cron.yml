name: SIMFONI Cron

on:
  schedule:
    - cron: "0 22 * * 6"   # sinkron berita + meta, tiap Minggu ~07:00 WIT (Sabtu 22:00 UTC)
    - cron: "0 1 * * *"    # cleanup data lama, tetap harian 01:00 UTC
  workflow_dispatch:        # tombol "Run workflow" manual buat testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Sinkron berita + Instagram/Facebook (mingguan)
        if: github.event.schedule == '0 22 * * 6' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail -sS -X POST "${{ secrets.APP_URL }}/api/scrape/news" \
            -H "x-scrape-key: ${{ secrets.SCRAPE_TRIGGER_KEY }}"
          curl --fail -sS -X POST "${{ secrets.APP_URL }}/api/scrape/meta" \
            -H "x-scrape-key: ${{ secrets.SCRAPE_TRIGGER_KEY }}"

      - name: Bersihkan data lama (harian)
        if: github.event.schedule == '0 1 * * *'
        run: |
          curl --fail -sS -X POST "${{ secrets.APP_URL }}/api/cron/cleanup" \
            -H "x-scrape-key: ${{ secrets.SCRAPE_TRIGGER_KEY }}"